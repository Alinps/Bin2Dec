<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Free online number base converter for Binary, Decimal, Octal and Hexadecimal conversions.">
    <title>Number Base Converter | Binary Decimal Converter</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="app">
        <section class="card">
            <h1>BaseBridge Converter</h1>
            <p class="subtitle">Convert numbers between base systems quickly.</p>

            <div class="controls">
                <input type="text" id="forminput" maxlength="16" placeholder="Enter a value (e.g. 10101101 or 42)">
                <select id="inputFrom">
                    <option value="Bin">Binary</option>
                    <option value="Dec">Decimal</option>
                    <option value="Hex">Hexadecimal</option>
                </select>
                <span class="to-label">to</span>
                <select id="inputTo">
                    <option value="Bin">Binary</option>
                    <option value="Dec">Decimal</option>
                    <option value="Hex">Hexadecimal</option>
                </select>
                <button onclick="handleConvert()">Convert</button>
            </div>

            <p id="outputelement">Converted result will appear here.</p>
        </section>
    </main>
    <script src="script.js"></script>

</body>
</html>
