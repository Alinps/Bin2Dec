<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bin2Dec</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="app">
        <section class="card">
            <h1>Binary to Decimal</h1>
            <p class="subtitle">Enter up to 8 binary digits and convert instantly.</p>

            <div class="controls">
                <input type="text" id="forminput" maxlength="8" placeholder="e.g. 10101101">
                <button onclick="BintoDec()">Convert</button>
            </div>

            <p id="outputelement">Your result will appear here.</p>
        </section>
    </main>
    <script src="script.js"></script>

</body>
</html>
